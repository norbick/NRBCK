<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#101510" />
		<meta name="description" content="Interaktywna mapa 3D serwera Minecraft." />
		<title>Mapa 3D serwera Minecraft</title>
		<script src="./server-config.js"></script>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #101510;
				color: #f4f7ef;
			}

			* { box-sizing: border-box; }

			body {
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
				background: #101510;
			}

			.map-page {
				position: relative;
				min-height: 100vh;
				min-height: 100dvh;
				overflow: hidden;
				background: #101510;
			}

			.map-frame {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				border: 0;
				background: #101510;
			}

			.topbar {
				position: absolute;
				z-index: 2;
				top: 0;
				right: 0;
				left: 0;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				padding: 0.85rem 1rem;
				border-bottom: 1px solid rgb(255 255 255 / 0.14);
				background: rgb(10 15 10 / 0.78);
				backdrop-filter: blur(12px);
			}

			.brand,
			.open-map {
				display: inline-flex;
				align-items: center;
				gap: 0.55rem;
				min-width: 0;
				font-size: 0.9rem;
				font-weight: 750;
			}

			.brand::before {
				width: 0.72rem;
				height: 0.72rem;
				flex: 0 0 auto;
				background: #b8ef70;
				box-shadow: 0 0 0 4px rgb(184 239 112 / 0.15);
				content: "";
			}

			.brand-name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.open-map {
				padding: 0.5rem 0.7rem;
				border: 1px solid rgb(255 255 255 / 0.21);
				border-radius: 0.38rem;
				color: inherit;
				text-decoration: none;
			}

			.open-map[hidden] { display: none; }

			.open-map:hover,
			.open-map:focus-visible {
				border-color: #b8ef70;
				background: rgb(184 239 112 / 0.1);
			}

			.empty-state {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 5.5rem 1.25rem 1.25rem;
				background:
					radial-gradient(circle at 50% 44%, rgb(80 132 72 / 0.22), transparent 30rem),
					linear-gradient(135deg, #101b11, #0a0f0a);
			}

			.empty-card {
				width: min(100%, 30rem);
				padding: clamp(1.5rem, 5vw, 2.75rem);
				border: 1px solid rgb(184 239 112 / 0.28);
				background: rgb(12 20 12 / 0.84);
				box-shadow: 0 20px 70px rgb(0 0 0 / 0.36);
				text-align: center;
			}

			.empty-card h1 {
				margin: 0 0 0.75rem;
				font-size: clamp(1.6rem, 5vw, 2.3rem);
				line-height: 1.05;
				letter-spacing: -0.045em;
			}

			.empty-card p {
				margin: 0;
				color: #bdc5b8;
			}

			.empty-card code {
				padding: 0.08em 0.28em;
				border-radius: 0.2rem;
				background: rgb(255 255 255 / 0.08);
				color: #dfffad;
			}

			.map-page.is-ready .empty-state { display: none; }

			@media (max-width: 480px) {
				.topbar { padding: 0.72rem 0.8rem; }
				.open-map { padding: 0.45rem 0.55rem; font-size: 0.8rem; }
			}
		</style>
	</head>
	<body>
		<main class="map-page" id="map-page">
			<iframe
				class="map-frame"
				id="map-frame"
				title="Interaktywna mapa 3D serwera Minecraft"
				loading="eager"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen
			></iframe>

			<header class="topbar">
				<span class="brand"><span class="brand-name" id="server-name">Mapa 3D</span></span>
				<a class="open-map" id="open-map" href="#" target="_blank" rel="noopener noreferrer" hidden>Otwórz osobno ↗</a>
			</header>

			<section class="empty-state" id="empty-state" aria-labelledby="empty-title">
				<div class="empty-card">
					<h1 id="empty-title">Mapa 3D czeka na podłączenie</h1>
					<p>Wystarczy wpisać adres BlueMap w <code>server-config.js</code>. Potem cała ta strona będzie mapą.</p>
				</div>
			</section>
		</main>

		<script>
			(() => {
				const config = window.SERVER_MAP_CONFIG || {};
				const serverName = String(config.serverName || 'Mapa 3D serwera Minecraft').trim();
				const mapUrl = String(config.mapUrl || '').trim();
				document.title = `${serverName} — mapa 3D`;
				document.getElementById('server-name').textContent = serverName;

				if (!mapUrl) return;

				try {
					const url = new URL(mapUrl);
					if (!['https:', 'http:'].includes(url.protocol)) return;
					document.getElementById('map-frame').src = url.href;
					document.getElementById('open-map').href = url.href;
					document.getElementById('open-map').hidden = false;
					document.getElementById('map-page').classList.add('is-ready');
				} catch {
					// A blank state is safer than embedding an invalid address.
				}
			})();
		</script>
	</body>
</html>
